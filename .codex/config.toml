# Cấu hình Codex riêng cho repo Meloo. Chỉ có hiệu lực khi bạn chọn tin cậy (trust) thư mục dự án.

# Jira chỉ cho phép công cụ ĐỌC, vì agent không được đổi Jira (AGENTS.md, luật 10).
# Đăng nhập một lần: codex mcp login atlassian
[mcp_servers.atlassian]
url = "https://mcp.atlassian.com/v2/mcp"
enabled_tools = [
  "getAccessibleAtlassianResources",
  "atlassianUserInfo",
  "getJiraIssue",
  "searchJiraIssuesUsingJql",
]
