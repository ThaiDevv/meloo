name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.base_ref }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            contracts:
              - 'contracts/**'
            e2e:
              - 'frontend/e2e/**'
              - 'frontend/playwright.config.ts'
              - 'infra/docker-compose.yml'

  backend:
    name: Backend · verify
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Spotless and Maven verification
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check verify

  frontend:
    name: Frontend · quality checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 10.34.7
          runtime: node@22
          install: false
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Unit tests
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm build
      - name: Check translation parity
        run: python3 .claude/skills/meloo-qa-check/scripts/check-i18n-parity.py frontend/src/locales

  contracts:
    name: Contracts · lint and generated client
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 10.34.7
          runtime: node@22
          install: false
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint OpenAPI contract
        if: hashFiles('contracts/openapi.yaml') != ''
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint --ruleset spectral:oas contracts/openapi.yaml
      - name: Lint AsyncAPI contract
        if: hashFiles('contracts/asyncapi.yaml') != ''
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint --ruleset spectral:asyncapi contracts/asyncapi.yaml
      - name: Verify generated API types
        if: hashFiles('contracts/openapi.yaml') != ''
        working-directory: frontend
        run: |
          pnpm gen:api
          git diff --exit-code -- src/shared/api/schema.gen.ts

  e2e:
    name: E2E · Playwright (opt-in until QA-01)
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && vars.ENABLE_E2E == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 10.34.7
          runtime: node@22
          install: false
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Start Compose dependencies
        run: docker compose -f infra/docker-compose.yml up -d --wait
      - name: Run Playwright
        working-directory: frontend
        run: pnpm e2e
      - name: Stop Compose dependencies
        if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes --remove-orphans

  gitleaks:
    name: Secret scan · gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
