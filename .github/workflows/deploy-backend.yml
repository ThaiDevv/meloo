name: Deploy Backend

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Bỏ qua paths-filter và deploy ngay'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect deploy triggers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v7
      - name: Paths filter on push to main
        id: filter
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') && github.event.before != '0000000000000000000000000000000000000000'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.before }}
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/**'
              - 'infra/**'
              - '.github/workflows/deploy-*.yml'
      - name: Determine if deploy should run
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ inputs.force_deploy }}" = "true" ]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::workflow_dispatch chỉ cho phép chạy từ nhánh main trừ khi bật force_deploy=true."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.backend }}" = "true" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & Push to GHCR
    needs: detect-changes
    if: needs.detect-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_image: ${{ steps.output-image.outputs.deploy_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/meloo-backend
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve target deployment image
        id: output-image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "deploy_image=ghcr.io/${OWNER}/meloo-backend:${TAG_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_image=ghcr.io/${OWNER}/meloo-backend:sha-${SHA7}" >> "$GITHUB_OUTPUT"
          fi

  deploy-ec2:
    name: Deploy to EC2
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get GitHub runner public IP
        id: runner-ip
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS --retry 3 https://checkip.amazonaws.com | tr -d '\r\n')"
          python3 -c 'import ipaddress, sys; ipaddress.IPv4Address(sys.argv[1])' "$RUNNER_IP"
          echo "cidr=${RUNNER_IP}/32" >> "$GITHUB_OUTPUT"
          echo "rule_description=meloo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Temporarily allow SSH from this runner
        id: allow-ssh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
          RUNNER_CIDR: ${{ steps.runner-ip.outputs.cidr }}
          RULE_DESCRIPTION: ${{ steps.runner-ip.outputs.rule_description }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || \
             [ -z "${AWS_REGION:-}" ] || [ -z "${EC2_SECURITY_GROUP_ID:-}" ]; then
            echo "::error::Thiếu một trong các GitHub Secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION hoặc EC2_SECURITY_GROUP_ID."
            exit 1
          fi

          IP_PERMISSIONS="$(python3 -c 'import json, os; print(json.dumps([{"IpProtocol": "tcp", "FromPort": 22, "ToPort": 22, "IpRanges": [{"CidrIp": os.environ["RUNNER_CIDR"], "Description": os.environ["RULE_DESCRIPTION"]}]}]))')"
          echo "cleanup=true" >> "$GITHUB_OUTPUT"
          RULE_ID="$(aws ec2 authorize-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "$IP_PERMISSIONS" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)"
          if [ -z "$RULE_ID" ] || [ "$RULE_ID" = "None" ]; then
            echo "::error::AWS không trả về ID của rule SSH vừa mở."
            exit 1
          fi
          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
          DEPLOY_IMAGE: ${{ needs.build-and-push.outputs.deploy_image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "${EC2_HOST:-}" ] || [ -z "${EC2_SSH_KEY:-}" ]; then
            echo "::error::Thiếu GitHub Secrets (EC2_HOST hoặc EC2_SSH_KEY). Vui lòng cấu hình theo docs/runbooks/aws-setup.md."
            exit 1
          fi

          if [ -z "${EC2_SSH_KNOWN_HOSTS:-}" ]; then
            echo "::error::Thiếu GitHub Secret EC2_SSH_KNOWN_HOSTS. Để bảo vệ StrictHostKeyChecking không bị MITM, vui lòng cấu hình public key của EC2 vào secret EC2_SSH_KNOWN_HOSTS."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "$EC2_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes"
          SCP_CMD="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes"

          echo "Đăng nhập GHCR trên EC2 qua stdin..."
          echo "$GH_TOKEN" | $SSH_CMD "${EC2_USER}@${EC2_HOST}" \
            "docker login ghcr.io -u '$ACTOR' --password-stdin"

          echo "Đồng bộ file cấu hình và script deploy lên EC2..."
          $SCP_CMD infra/compose/docker-compose.prod.yml "${EC2_USER}@${EC2_HOST}:/opt/meloo/docker-compose.yml"
          $SCP_CMD infra/compose/deploy-ec2.sh "${EC2_USER}@${EC2_HOST}:/opt/meloo/deploy-ec2.sh"

          echo "Thực thi kịch bản deploy trên EC2..."
          $SSH_CMD "${EC2_USER}@${EC2_HOST}" \
            "chmod +x /opt/meloo/deploy-ec2.sh && /opt/meloo/deploy-ec2.sh '$DEPLOY_IMAGE'"

      - name: Revoke temporary SSH ingress
        if: ${{ always() && steps.allow-ssh.outputs.cleanup == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
          RUNNER_CIDR: ${{ steps.runner-ip.outputs.cidr }}
          RULE_DESCRIPTION: ${{ steps.runner-ip.outputs.rule_description }}
          AWS_SECURITY_GROUP_RULE_ID: ${{ steps.allow-ssh.outputs.rule_id }}
        run: |
          set -euo pipefail
          RULE_ID="${AWS_SECURITY_GROUP_RULE_ID:-}"
          if [ -z "$RULE_ID" ] || [ "$RULE_ID" = "None" ]; then
            for attempt in 1 2 3 4 5 6; do
              SECURITY_GROUP_RULES="$(aws ec2 describe-security-group-rules \
                --region "$AWS_REGION" \
                --filters "Name=group-id,Values=$EC2_SECURITY_GROUP_ID" \
                --output json)"
              RULE_ID="$(python3 -c '
          import json
          import sys

          cidr, description = sys.argv[1:]
          rules = json.load(sys.stdin)["SecurityGroupRules"]
          matches = [
              rule for rule in rules
              if not rule.get("IsEgress", False)
              and rule.get("IpProtocol") == "tcp"
              and rule.get("FromPort") == 22
              and rule.get("ToPort") == 22
              and rule.get("CidrIpv4") == cidr
              and rule.get("Description") == description
          ]
          if len(matches) > 1:
              raise SystemExit("Multiple matching temporary SSH rules found")
          print(matches[0]["SecurityGroupRuleId"] if matches else "")
          ' "$RUNNER_CIDR" "$RULE_DESCRIPTION" <<< "$SECURITY_GROUP_RULES")"
              if [ -n "$RULE_ID" ]; then
                break
              fi
              sleep 5
            done
          fi

          if [ -z "$RULE_ID" ] || [ "$RULE_ID" = "None" ]; then
            echo "::notice::Không tìm thấy rule SSH tạm của lần chạy này để thu hồi."
            exit 0
          fi

          aws ec2 revoke-security-group-ingress \
            --region "$AWS_REGION" \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --security-group-rule-ids "$RULE_ID"

  release:
    name: GitHub Release (Tags)
    needs: deploy-ec2
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Meloo ${{ github.ref_name }}" \
            --generate-notes || \
          gh release edit "${{ github.ref_name }}" --title "Meloo ${{ github.ref_name }}"
