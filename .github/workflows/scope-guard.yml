name: Scope guard

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

concurrency:
  group: scope-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  scope-guard:
    name: Scope and hot-file guard
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check declared scope and hot files
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          printf '%s' "$PR_BODY" > "$body_file"
          bash .claude/skills/meloo-ticket/scripts/check-scope.sh --pr-body "$body_file" --base "$BASE_REF"
