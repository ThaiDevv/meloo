spring:
  application:
    name: meloo-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import:
      - classpath:config/shared.yml
      - classpath:config/identity.yml
      - classpath:config/catalog.yml
      - classpath:config/audio.yml
      - classpath:config/game.yml
      - classpath:config/room.yml
      - classpath:config/chat.yml
      - classpath:config/voice.yml
      - classpath:config/progression.yml
      - classpath:config/daily.yml
      - classpath:config/admin.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meloo}
    username: ${DB_USERNAME:meloo}
    password: ${DB_PASSWORD:meloo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

meloo:
  cors:
    allowed-origins: ${MELOO_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never
