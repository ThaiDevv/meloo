# Test configuration for audio module
meloo:
  audio:
    hmac-secret: "test-hmac-secret-key-for-unit-and-integration-tests-must-be-long-enough"
    token-ttl: 2m
    preview-cache-ttl: 15m
    preview-cache-max-size: 1000
    active-rounds-ttl: 45m
    active-rounds-max-size: 2000
    rate-limit:
      token-capacity: 5
      token-refill-tokens: 5
      token-refill-duration: 1m
      player-capacity: 30
      player-refill-tokens: 30
      player-refill-duration: 1m
    provider:
      type: fake
      deezer:
        base-url: https://api.deezer.com
        timeout: 5s
        max-attempts: 3
        backoff: 500ms
        circuit-breaker:
          sliding-window-size: 10
          failure-rate-threshold: 50.0
          wait-duration-in-open-state: 10s
      fake:
        media-location: classpath:fake-media/
