      description: |
        Requires role `ADMIN` (`CatalogAdminApi.addTracksToPlaylist`). Attaches one or more enabled tracks to the
        playlist (idempotent for tracks already in the playlist) and returns the updated `AdminPlaylist`.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPlaylistTracksRequest'
            examples:
              default:
                externalValue: ./examples/admin/playlist-tracks.request.json
      responses:
        '200':
          description: Tracks added to playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlaylist'
              examples:
                default:
                  externalValue: ./examples/admin/update-admin-playlist.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Playlist or track not found (`PLAYLIST_NOT_FOUND`, `TRACK_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                playlistNotFound:
                  externalValue: ./examples/game/problem.playlist-not-found.404.json
    delete:
      tags: [admin]
      operationId: removeAdminPlaylistTracks
      summary: Remove tracks from a playlist
      description: |
        Requires role `ADMIN` (`CatalogAdminApi.removeTracksFromPlaylist`). Removes one or more tracks from the
        playlist (refused with 422 `NOT_ENOUGH_TRACKS` if an enabled playlist would drop below 5 enabled tracks, BR-09)
        and returns the updated `AdminPlaylist`.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPlaylistTracksRequest'
            examples:
              default:
                externalValue: ./examples/admin/playlist-tracks.request.json
      responses:
        '200':
          description: Tracks removed from playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlaylist'
              examples:
                default:
                  externalValue: ./examples/admin/update-admin-playlist.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Playlist not found (`PLAYLIST_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                playlistNotFound:
                  externalValue: ./examples/game/problem.playlist-not-found.404.json
        '422':
          description: Removing the tracks would leave an enabled playlist with fewer than 5 enabled tracks (`NOT_ENOUGH_TRACKS`, BR-09).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotEnoughTracksProblem'
              examples:
                notEnoughTracks:
                  externalValue: ./examples/room/problem.not-enough-tracks.422.json
  /api/v1/admin/users:
