      operationId: getMyProfile
      summary: Get the current player's profile
      description: |
        Any signed-in user (guest or registered, BR-20). Returns full profile details including `rankPoints` (01/11
        supplement, BR-24), `xp`, `avatarUrl`, `avatarId`, `profileCompleted` and linked OAuth providers (CT-04, BE-ID-04).
        Guests have a read-only profile (`GET` only; editing via `PATCH /api/v1/me/profile` requires a `REGISTERED` account per BR-20).
      responses:
        '200':
          description: Current player profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                default:
                  externalValue: ./examples/progression/get-my-profile.200.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [progression]
      operationId: updateMyProfile
      summary: Update the current registered player's profile (nickname and avatar)
      description: |
        Registered users only (`REGISTERED`, BR-20, CT-04, BE-ID-04, FE-AUTH-04).
        Updates the caller's display `nickname` (3-20 characters, validated against banned-word list per BR-22) and/or preset `avatarId` (`guitar`, `drum`, `headphones`, `disc`, `mic`, `piano`, `radio`, `wave`).

        **Chính sách thiết lập hồ sơ và tài khoản (CT-04):**
        - **Tài khoản mới qua OAuth:** Ban đầu `profileCompleted = false`. Lần đầu lưu thành công nickname hợp lệ và avatar preset hợp lệ trong cùng transaction sẽ đánh dấu `profileCompleted = true`.
        - **Khách nâng cấp (BR-21):**
          + Khi khách nâng cấp tạo tài khoản mới: nếu khách đã có nickname hợp lệ và `avatarId` hợp lệ thì chuyển sang tài khoản mới và đánh dấu `profileCompleted = true`; nếu chưa chọn avatar hoặc nickname tạm thì giữ `profileCompleted = false`.
          + Khi khách đăng nhập vào tài khoản đã tồn tại và đã hoàn tất (`profileCompleted = true`): thông tin nickname và avatar đã lưu của tài khoản đích LUÔN ĐƯỢC ƯU TIÊN GIỮ NGUYÊN (không bị ghi đè bởi nickname/avatar tạm của khách); chỉ dữ liệu lịch sử trận, thống kê, huy hiệu của khách được gộp vào tài khoản đích theo BR-21.
        - **Tài khoản cũ:** Mặc định `profileCompleted = true` khi nâng cấp hệ thống; người dùng có thể đổi nickname/avatar bất kỳ lúc nào qua endpoint này.
        - **Tài khoản đã hoàn tất (`profileCompleted = true`):** Đăng nhập lại, refresh session, reload không bao giờ ghi đè nickname hay avatar đã chọn. Trạng thái hoàn tất được quản lý bền vững phía server, KHÔNG bao giờ suy đoán từ tiền tố `Player_`.
        - **Quy tắc hiển thị avatar (FE-AUTH-04):** Giao diện client ưu tiên hiển thị preset avatar (`avatarId`) nếu người dùng đã chọn; `avatarUrl` (từ OAuth) dùng làm dự phòng khi `avatarId` là null; fallback về chữ cái đầu khi cả hai cùng null.
        - **Bảo mật:** Chỉ người dùng được sửa hồ sơ của chính mình (qua JWT session). Khách gọi sẽ bị từ chối 403 (`GUEST_PROFILE_READ_ONLY`). Tài khoản bị khóa nhận 403 (`ACCOUNT_LOCKED`).
        - **Xác thực dữ liệu:** Gửi `avatarId` không thuộc danh sách 8 preset hợp lệ hoặc `nickname` vi phạm BR-22 trả về lỗi 400 (`VALIDATION_FAILED` hoặc `INVALID_AVATAR`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            examples:
              default:
                summary: Update nickname only
                externalValue: ./examples/progression/update-my-profile.request.json
              presetSetup:
                summary: Initial profile setup or update with nickname and preset avatar
                externalValue: ./examples/progression/update-my-profile.request.preset.json
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                default:
                  externalValue: ./examples/progression/update-my-profile.200.json
        '400':
          description: Validation failed (banned word, invalid length, or invalid avatar preset ID).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  summary: Validation failed
                  externalValue: ./examples/common/problem.validation-failed.400.json
                invalidAvatar:
                  summary: Invalid avatar preset ID
                  externalValue: ./examples/progression/problem.invalid-avatar.400.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden. Registered account required; guest profiles are read-only and receive `GUEST_PROFILE_READ_ONLY` (BR-20), or the account is locked (`ACCOUNT_LOCKED`, BR-28).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                guestProfileReadOnly:
                  summary: Guest profiles are read-only (BR-20)
                  externalValue: ./examples/progression/problem.guest-profile-read-only.403.json
                accountLocked:
                  summary: Account is locked (BR-28)
                  externalValue: ./examples/audio/problem.forbidden.403.json
