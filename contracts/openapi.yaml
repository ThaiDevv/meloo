  /api/v1/admin/tracks:
    get:
      tags: [admin]
      operationId: listAdminTracks
      summary: Search and filter catalog tracks for administration
      description: |
        Requires role `ADMIN` (`CatalogAdminApi.searchTracks`). Lists catalog tracks (both enabled and disabled, BR-27)
        with optional search query (`q`) and filters for `enabled`, `genreCode`, `countryCode` and `decade`.
      parameters:
        - name: q
          in: query
          required: false
          description: Optional search text matching normalized title or artist name.
          schema:
            type: string
            maxLength: 100
        - name: enabled
          in: query
          required: false
          description: Filter by enabled status (BR-27).
          schema:
            type: boolean
        - name: genreCode
          in: query
          required: false
          description: Filter by genre code.
          schema:
            type: string
            maxLength: 40
        - name: countryCode
          in: query
          required: false
          description: Filter by two-letter ISO 3166-1 alpha-2 country code.
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
        - name: decade
          in: query
          required: false
          description: Filter by release decade start year (e.g. `1990`, `2000`, `2010`, `2020`).
          schema:
            type: integer
            minimum: 1900
            maximum: 2090
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of catalog tracks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrackPage'
              examples:
                default:
                  externalValue: ./examples/admin/list-admin-tracks.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/tracks/{trackId}/metadata:
    put:
      tags: [admin]
      operationId: updateAdminTrackMetadata
      summary: Update genre, country and release year of a catalog track
      description: |
        Requires role `ADMIN` (`CatalogAdminApi.updateTrackMetadata`). Updates curated metadata (`genreId`,
        `countryCode`, `releaseYear`) and records an admin audit log entry.
      parameters:
        - $ref: '#/components/parameters/TrackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTrackMetadataRequest'
            examples:
              default:
                externalValue: ./examples/admin/update-admin-track-metadata.request.json
      responses:
        '200':
          description: Updated catalog track.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrack'
              examples:
                default:
                  externalValue: ./examples/admin/update-admin-track-metadata.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Track not found (`TRACK_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                trackNotFound:
                  externalValue: ./examples/game/problem.track-not-found.404.json
  /api/v1/admin/tracks/{trackId}/status:
    put:
      tags: [admin]
