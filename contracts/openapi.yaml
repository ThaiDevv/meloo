    DailyAttemptStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, SOLVED, UNSOLVED]
      description: Status of the caller's daily challenge attempt for today (BR-25).
    DailyCompletionStatus:
      type: string
      enum: [SOLVED, UNSOLVED]
      description: Final status of a completed daily challenge attempt.
    DailyLevelStatus:
      type: string
      enum: [CORRECT, WRONG, UNOPENED]
      description: Per-level outcome for the 5 listening slots (`2s`, `5s`, `10s`, `20s`, `30s`) used in the spoiler-free share summary (BR-25).
    DailyListenSeconds:
      type: integer
      enum: [2, 5, 10, 20, 30]
      description: Listening duration in seconds for a level (`2`, `5`, `10`, `20`, `30`, BR-01).
    DailyRoundState:
      type: object
      description: An in-progress daily challenge attempt. Locked to the `challengeDate` and track issued by the server at `startedAt` even if continued across 00:00 UTC+7 within its 5-minute `expiresAt` ceiling (BR-25, UC-10 branch 4a). Deliberately has no answer, track id, title or artist field (NFR-07, BR-25).
      required: [challengeDate, level, listenSeconds, canListenMore, canSkip, wrongCount, audio, startedAt, expiresAt, serverTime]
      properties:
        challengeDate:
          type: string
          format: date
          description: Challenge date (`yyyy-MM-dd` in `Asia/Ho_Chi_Minh`) issued by the server when the attempt started; preserved across 00:00 UTC+7 until the attempt completes or expires (BR-25).
        level:
          type: integer
          minimum: 1
          maximum: 5
          description: Opened listening level, 1 to 5 (BR-01).
        listenSeconds:
          $ref: '#/components/schemas/DailyListenSeconds'
        canListenMore:
          type: boolean
          description: '`level` < 5.'
        canSkip:
          type: boolean
          description: '`level` = 5 (BR-04).'
        wrongCount:
          type: integer
          minimum: 0
          maximum: 5
        audio:
          $ref: '#/components/schemas/AudioClip'
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 5-minute ceiling from `startedAt` after which an unfinished attempt becomes `UNSOLVED` (`TIMEOUT`, BR-25).
        serverTime:
          type: string
          format: date-time
    DailyResult:
      type: object
      description: Completed daily challenge result with spoiler-free level slots and revealed song answer (BR-25, BR-29).
      required: [challengeDate, status, outcome, levels, score, wrongCount, elapsedMs, currentStreak, longestStreak, nextResetAt, answer]
      properties:
        challengeDate:
          type: string
          format: date
          description: Challenge date (`yyyy-MM-dd` in `Asia/Ho_Chi_Minh`) issued by the server when the attempt started, even if completed after 00:00 UTC+7 (BR-25, UC-10 branch 4a).
        status:
          $ref: '#/components/schemas/DailyCompletionStatus'
        outcome:
          $ref: '#/components/schemas/RoundOutcome'
        correctLevel:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: Level of the correct guess (1..5) when `status` is `SOLVED`, otherwise null.
        correctListenSeconds:
          oneOf:
            - $ref: '#/components/schemas/DailyListenSeconds'
            - type: 'null'
          description: Listening duration in seconds (`2`, `5`, `10`, `20`, `30`) when `status` is `SOLVED`, otherwise null.
        levels:
          type: array
          minItems: 5
          maxItems: 5
          description: Five level slots (`2s`, `5s`, `10s`, `20s`, `30s`) for the spoiler-free share summary (`Meloo #YYYY-MM-DD`, BR-25).
          items:
            $ref: '#/components/schemas/DailyLevelStatus'
        score:
          type: integer
          enum: [0, 200, 400, 600, 800, 1000]
          description: Base score at the solved level (BR-02), or 0 when `UNSOLVED`.
        wrongCount:
          type: integer
          minimum: 0
          maximum: 5
        elapsedMs:
          type: integer
          minimum: 0
          description: Total elapsed time in milliseconds from `startedAt` to completion (BR-25).
        rank:
          type: [integer, 'null']
          minimum: 1
          description: Caller's rank on that day's daily leaderboard for registered players (`REGISTERED`), or null for guests (`BR-20`, `UC-10` branch 5a).
        currentStreak:
          type: integer
          minimum: 0
          description: Consecutive days solved (`SOLVED`) up to today (BR-25).
        longestStreak:
          type: integer
          minimum: 0
          description: All-time longest consecutive solved-day streak.
        nextResetAt:
          type: string
          format: date-time
          description: Next daily reset timestamp (00:00 `Asia/Ho_Chi_Minh`).
        answer:
          $ref: '#/components/schemas/Answer'
    DailyTodayResponse:
      type: object
      description: Today's daily challenge status. Contains `round` only when `IN_PROGRESS` (never exposing the answer) and `result` only when `SOLVED` or `UNSOLVED`.
      required: [challengeDate, status, currentStreak, longestStreak, nextResetAt, serverTime]
      properties:
        challengeDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DailyAttemptStatus'
        currentStreak:
          type: integer
          minimum: 0
        longestStreak:
          type: integer
          minimum: 0
        nextResetAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
        round:
          $ref: '#/components/schemas/DailyRoundState'
          description: Present only when `status` is `IN_PROGRESS`.
        result:
          $ref: '#/components/schemas/DailyResult'
          description: Present only when `status` is `SOLVED` or `UNSOLVED`.
    DailyGuessResponse:
      type: object
      required: [correct, rightArtist, attemptEnded]
      properties:
        correct:
          type: boolean
        rightArtist:
          type: boolean
          description: True only for a wrong guess by the right main artist (BR-06); always false when `correct` is true.
        attemptEnded:
          type: boolean
        round:
          $ref: '#/components/schemas/DailyRoundState'
          description: Present when `attemptEnded` is false (next listening level opened; no answer fields).
        result:
          $ref: '#/components/schemas/DailyResult'
          description: Present when `attemptEnded` is true (`SOLVED` or `WRONG_OUT` at 30s).
    DailyLeaderboardEntry:
      type: object
      required: [rank, userId, nickname, status, score, elapsedMs, completedAt]
      properties:
        rank:
          type: integer
          minimum: 1
        userId:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 3
          maxLength: 20
        avatarUrl:
          type: [string, 'null']
        avatarId:
          type: [string, 'null']
          enum: [guitar, drum, headphones, disc, mic, piano, radio, wave, null]
          description: Preset avatar identifier if chosen (CT-04, FE-AUTH-04).
        status:
          $ref: '#/components/schemas/DailyCompletionStatus'
        correctLevel:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
        listenSeconds:
          oneOf:
            - $ref: '#/components/schemas/DailyListenSeconds'
            - type: 'null'
        score:
          type: integer
          enum: [0, 200, 400, 600, 800, 1000]
        elapsedMs:
          type: integer
          minimum: 0
        completedAt:
          type: string
          format: date-time
    DailyLeaderboardPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [challengeDate, items]
          properties:
            challengeDate:
              type: string
              format: date
            items:
              type: array
              description: Ranked entries of registered players (`REGISTERED`, `is_guest = false` per BR-20 and DES-01) who completed the challenge for `challengeDate`. Guest attempts are never included.
              items:
                $ref: '#/components/schemas/DailyLeaderboardEntry'
            myEntry:
              oneOf:
                - $ref: '#/components/schemas/DailyLeaderboardEntry'
                - type: 'null'
              description: The caller's own entry on that day's daily leaderboard if they are a registered player (`REGISTERED`) who completed `challengeDate`; always null for guests (BR-20, UC-10 branch 5a) or when not yet completed.
    DailyHistoryItem:
      type: object
      description: A single solved day in the caller's daily challenge history (29/10 supplement). Deliberately has no track or answer fields.
      required: [date, level]
      properties:
        date:
          type: string
          format: date
          description: Challenge date (`yyyy-MM-dd` in `Asia/Ho_Chi_Minh`).
        level:
          $ref: '#/components/schemas/DailyListenSeconds'
          description: Listening level duration in seconds (`2`, `5`, `10`, `20` or `30`) at which the player solved that day's challenge.
    DailyHistoryResponse:
      type: object
      description: Sparse solved-day history for the home page `StreakGrid` (29/10 supplement, BR-25).
      required: [today, items, currentStreak, longestStreak]
      properties:
        today:
          type: string
          format: date
          description: Current challenge date on the server (`yyyy-MM-dd` in `Asia/Ho_Chi_Minh`) so the client aligns the streak grid without clock skew.
        items:
          type: array
          description: Sparse list of days where `status = SOLVED` within the requested window, sorted ascending by `date`. Unsolved or unplayed days are omitted.
          items:
            $ref: '#/components/schemas/DailyHistoryItem'
        currentStreak:
          type: integer
          minimum: 0
          description: Current consecutive solved-day streak up to `today` (or `yesterday` if `today` is not yet played/failed).
        longestStreak:
          type: integer
          minimum: 0
          description: Longest consecutive solved-day streak within the queried range.
    AdminDashboard:
      type: object
      required: [activeRooms, onlinePlayers, matchesToday, dailyPlayersToday, openChatReports, enabledTracks, disabledTracks, totalRegisteredUsers, totalGuestsToday, serverTime]
      properties:
        activeRooms:
          type: integer
          minimum: 0
        onlinePlayers:
          type: integer
          minimum: 0
        matchesToday:
          type: integer
          minimum: 0
        dailyPlayersToday:
          type: integer
          minimum: 0
        openChatReports:
          type: integer
          minimum: 0
        enabledTracks:
          type: integer
          minimum: 0
        disabledTracks:
          type: integer
          minimum: 0
        totalRegisteredUsers:
          type: integer
          minimum: 0
        totalGuestsToday:
          type: integer
          minimum: 0
        serverTime:
          type: string
          format: date-time
    AdminTrack:
      type: object
      description: Full admin view of a catalog track (`AdminTrackView`, BR-27).
      required: [id, provider, providerTrackId, title, artistName, genreId, genreCode, countryCode, releaseYear, enabled, disabledReason, coverUrl]
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/MusicProvider'
        providerTrackId:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 300
        artistName:
          type: string
          maxLength: 200
        genreId:
          type: [string, 'null']
          format: uuid
        genreCode:
          type: [string, 'null']
          maxLength: 40
        countryCode:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
        releaseYear:
          type: [integer, 'null']
          minimum: 1900
          maximum: 2100
        enabled:
          type: boolean
        disabledReason:
          type: [string, 'null']
          maxLength: 200
        coverUrl:
          type: [string, 'null']
          maxLength: 500
    AdminTrackPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminTrack'
    AdminTrackMetadataRequest:
      type: object
      additionalProperties: false
      description: Full replacement of editable track metadata (`TrackMetadataUpdate`). A null value clears the field.
      properties:
        genreId:
          type: [string, 'null']
          format: uuid
          description: Genre UUID to assign, or null to clear.
        countryCode:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
        releaseYear:
          type: [integer, 'null']
          minimum: 1900
          maximum: 2100
    AdminTrackStatusRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        disabledReason:
          type: [string, 'null']
          maxLength: 200
          description: 'Reason when disabling a track (`enabled: false`, BR-27).'
    AdminTrackImportRequest:
      type: object
      additionalProperties: false
      description: |
        Imports tracks into the catalog either by search `query` (`CatalogAdminApi.importByQuery`) or by a single
        `providerTrackId` (`CatalogAdminApi.importByProviderTrackId`). Exactly one of `query` or `providerTrackId` must
        be provided.
      properties:
        query:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
          description: Search text for provider import (`importByQuery`).
        providerTrackId:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
          description: Single provider track identifier for direct import (`importByProviderTrackId`).
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 25
          description: Maximum number of tracks to import when using `query`.
        genreId:
          type: [string, 'null']
          format: uuid
          description: Optional genre UUID assigned to imported tracks.
        defaultCountryCode:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
          description: Optional two-letter ISO 3166-1 alpha-2 country code assigned to imported tracks.
    AdminImportResult:
      type: object
      description: Summary of a provider track import (`com.meloo.catalog.api.AdminImportResult`).
      required: [totalProcessed, importedCount, skippedNoPreviewCount, duplicateCount, tracks]
      properties:
        totalProcessed:
          type: integer
          minimum: 0
        importedCount:
          type: integer
          minimum: 0
        skippedNoPreviewCount:
          type: integer
          minimum: 0
        duplicateCount:
          type: integer
          minimum: 0
        tracks:
          type: array
          description: Tracks created by this call plus already-known tracks it matched.
          items:
            $ref: '#/components/schemas/AdminTrack'
    AdminPlaylist:
      type: object
      description: Admin view of a playlist (`AdminPlaylistView`).
      required: [id, code, nameVi, nameEn, curated, enabled, trackIds, enabledTrackCount]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 60
        nameVi:
          type: string
          maxLength: 120
        nameEn:
          type: string
          maxLength: 120
        curated:
          type: boolean
          description: True for curated playlists, false for the standard set (`STANDARD`, BR-23).
        enabled:
          type: boolean
        trackIds:
          type: array
          description: Track UUIDs in play order (both enabled and disabled).
          items:
            type: string
            format: uuid
        enabledTrackCount:
          type: integer
          minimum: 0
          description: Number of enabled tracks in the playlist that can be chosen for a new match.
    AdminPlaylistListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminPlaylist'
    AdminCreatePlaylistRequest:
      type: object
      additionalProperties: false
      description: Creates a curated playlist (`CatalogAdminApi.createPlaylist`). Requires at least 5 enabled tracks (BR-09).
      required: [code, nameVi, nameEn, trackIds]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 60
          pattern: '^[a-z0-9-]+$'
        nameVi:
          type: string
          minLength: 1
          maxLength: 120
        nameEn:
          type: string
          minLength: 1
          maxLength: 120
        trackIds:
          type: array
          minItems: 5
          maxItems: 500
          description: Initial list of enabled track UUIDs (at least 5 required by BR-09).
          items:
            type: string
            format: uuid
    AdminUpdatePlaylistRequest:
      type: object
      additionalProperties: false
      required: [nameVi, nameEn, enabled]
      properties:
        nameVi:
          type: string
          minLength: 1
          maxLength: 120
        nameEn:
          type: string
          minLength: 1
          maxLength: 120
        enabled:
          type: boolean
    AdminPlaylistTracksRequest:
      type: object
      additionalProperties: false
      required: [trackIds]
      properties:
        trackIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
    UserAccountStatus:
      type: string
      enum: [ACTIVE, LOCKED]
      description: Account status in `app_user.status` (BR-28).
    AdminUser:
      type: object
      required: [id, kind, role, status, nickname, rankPoints, linkedProviders, lastActiveAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/UserKind'
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserAccountStatus'
        nickname:
          type: string
          minLength: 3
          maxLength: 20
        email:
          type: [string, 'null']
          format: email
          maxLength: 254
        avatarUrl:
          type: [string, 'null']
        avatarId:
          type: [string, 'null']
          enum: [guitar, drum, headphones, disc, mic, piano, radio, wave, null]
          description: Preset avatar identifier if chosen (CT-04, FE-AUTH-04).
        profileCompleted:
          type: boolean
          description: Whether the user has completed their initial profile setup (CT-04).
        rankPoints:
          type: integer
          minimum: 0
        linkedProviders:
          type: array
          items:
            $ref: '#/components/schemas/OAuthProvider'
        lockReason:
          type: [string, 'null']
        lockedAt:
          type: [string, 'null']
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    AdminUserPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'
    AdminUserLockRequest:
      type: object
      additionalProperties: false
      required: [locked]
      properties:
        locked:
          type: boolean
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Required when `locked` is true (BR-28).
    AdminUserRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
    ChatReportStatus:
      type: string
      enum: [OPEN, DISMISSED, ACTIONED]
      description: Moderation state of a chat report (`chat_report.status`).
    ChatReportResolutionStatus:
      type: string
      enum: [DISMISSED, ACTIONED]
      description: Target status when resolving a chat report.
    AdminChatContextMessage:
      type: object
      additionalProperties: false
      description: A chat message snapshot stored in `chat_report.context` (`ChatContextMessage`, BR-19).
      required: [messageId, senderId, senderNickname, content, sentAt]
      properties:
        messageId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        senderNickname:
          type: string
          maxLength: 20
        content:
          type: string
          maxLength: 200
        sentAt:
          type: string
          format: date-time
    AdminChatReport:
      type: object
      required: [id, messageText, senderId, senderNickname, reporterId, context, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        messageText:
          type: string
          maxLength: 200
        senderId:
          type: string
          format: uuid
        senderNickname:
          type: string
          maxLength: 20
        reporterId:
          type: string
          format: uuid
        context:
          type: array
          description: Up to 5 preceding chat messages in the room for moderation context (`ChatContextMessage[]`, BR-19).
          items:
            $ref: '#/components/schemas/AdminChatContextMessage'
        status:
          $ref: '#/components/schemas/ChatReportStatus'
        handledBy:
          type: [string, 'null']
          format: uuid
        handledAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    AdminChatReportPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminChatReport'
    AdminResolveChatReportRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ChatReportResolutionStatus'
        lockSender:
          type: boolean
          default: false
          description: When true and `status` is `ACTIONED`, also locks the reported sender's account (BR-28).
        lockReason:
          type: [string, 'null']
          maxLength: 500
          description: Reason recorded on the sender's account when `lockSender` is true.
    AdminBannedWord:
      type: object
      required: [id, word, createdAt]
      properties:
        id:
          type: string
          format: uuid
        word:
          type: string
          minLength: 1
          maxLength: 80
        createdBy:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
    AdminBannedWordListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminBannedWord'
    AdminBannedWordRequest:
      type: object
      additionalProperties: false
      required: [word]
      properties:
        word:
          type: string
          minLength: 1
          maxLength: 80
          description: Word or phrase to block (normalized to lowercase NFC, BR-17, BR-22).
    DailyChallengeSource:
      type: string
      enum: [SCHEDULED, AUTO]
      description: How the daily challenge track was selected (`SCHEDULED` by admin or `AUTO` fallback, V7 `daily_challenge.source`, BR-25).
    AdminDailyScheduleItem:
      type: object
      required: [challengeDate, trackId, title, artistName, provider, source, locked, createdAt]
      properties:
        challengeDate:
          type: string
          format: date
        trackId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        artistName:
          type: string
          maxLength: 200
        provider:
          $ref: '#/components/schemas/MusicProvider'
        source:
          $ref: '#/components/schemas/DailyChallengeSource'
        locked:
          type: boolean
          description: True when `challengeDate` is today or in the past in `Asia/Ho_Chi_Minh` and can no longer be edited.
        createdBy:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
    AdminDailyScheduleResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminDailyScheduleItem'
    AdminScheduleDailyRequest:
      type: object
      additionalProperties: false
      required: [trackId]
      properties:
        trackId:
          type: string
          format: uuid
          description: Enabled catalog track UUID to schedule for `challengeDate` (BR-25, BR-27).
    AdminAuditLog:
      type: object
      required: [id, actorId, action, targetType, reason, detail, createdAt]
      properties:
        id:
          type: integer
          format: int64
          description: Sequential audit log entry ID (`audit_log.id` bigint, V8).
        actorId:
          type: string
          format: uuid
        actorNickname:
          type: [string, 'null']
          maxLength: 20
        action:
          type: string
          maxLength: 40
        targetType:
          type: string
          maxLength: 30
        targetId:
          type: [string, 'null']
          maxLength: 64
        reason:
          type: [string, 'null']
          description: Administrative reason (mandatory when `action = USER_LOCK`, BR-28).
        detail:
          type: [object, 'null']
          additionalProperties: true
          description: Structured audit metadata (`audit_log.detail` JSONB).
        createdAt:
          type: string
          format: date-time
    AdminAuditLogPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminAuditLog'
