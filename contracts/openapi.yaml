          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The banned word already exists (`BANNED_WORD_ALREADY_EXISTS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                alreadyExists:
                  externalValue: ./examples/admin/problem.banned-word-exists.409.json
  /api/v1/admin/banned-words/{wordId}:
    put:
      tags: [admin]
      operationId: updateAdminBannedWord
      summary: Update an existing banned word
      description: |
        Requires role `ADMIN` (`ChatAdminApi.updateBannedWord`). Updates the text of an existing banned word and
        refreshes the in-memory matcher.
      parameters:
        - $ref: '#/components/parameters/WordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBannedWordRequest'
            examples:
              default:
                externalValue: ./examples/admin/banned-word.request.json
      responses:
        '200':
          description: Banned word updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBannedWord'
              examples:
                default:
                  externalValue: ./examples/admin/banned-word.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Banned word not found (`BANNED_WORD_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  externalValue: ./examples/common/problem.not-found.404.json
        '409':
          description: Another banned word with the same text already exists (`BANNED_WORD_ALREADY_EXISTS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                alreadyExists:
                  externalValue: ./examples/admin/problem.banned-word-exists.409.json
    delete:
      tags: [admin]
      operationId: deleteAdminBannedWord
      summary: Delete a banned word
      description: |
        Requires role `ADMIN` (`ChatAdminApi.deleteBannedWord`). Deletes a banned word, refreshes the in-memory matcher
        and records an admin audit log entry.
      parameters:
        - $ref: '#/components/parameters/WordId'
      responses:
        '204':
          description: Banned word deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Banned word not found (`BANNED_WORD_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  externalValue: ./examples/common/problem.not-found.404.json
  /api/v1/admin/daily-schedule:
    get:
      tags: [admin]
      operationId: listAdminDailySchedule
      summary: List scheduled daily challenges within a date range
      description: |
        Requires role `ADMIN` (BR-25, BE-DAILY-01). Lists daily challenge track assignments between `from` and `to`
        (`Asia/Ho_Chi_Minh` `yyyy-MM-dd`).
      parameters:
        - name: from
          in: query
          required: false
          description: Start date inclusive (`yyyy-MM-dd`).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: End date inclusive (`yyyy-MM-dd`).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Scheduled daily challenges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDailyScheduleResponse'
              examples:
                default:
                  externalValue: ./examples/admin/list-admin-daily-schedule.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/daily-schedule/{challengeDate}:
    put:
      tags: [admin]
      operationId: scheduleAdminDailyChallenge
      summary: Assign or replace the daily challenge track for a future date
      description: |
        Requires role `ADMIN` (BR-25, BE-DAILY-01). Assigns an enabled catalog `trackId` (`source: SCHEDULED`) to a
        future `challengeDate` (`Asia/Ho_Chi_Minh`) and records an admin audit log entry. Past or currently active dates
        cannot be modified and return 409 (`DAILY_CHALLENGE_LOCKED`).
      parameters:
        - $ref: '#/components/parameters/ChallengeDate'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminScheduleDailyRequest'
            examples:
              default:
                externalValue: ./examples/admin/schedule-admin-daily.request.json
      responses:
        '200':
          description: Daily challenge scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDailyScheduleItem'
              examples:
                default:
                  externalValue: ./examples/admin/schedule-admin-daily.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Track not found (`TRACK_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                trackNotFound:
                  externalValue: ./examples/game/problem.track-not-found.404.json
        '409':
          description: Past or active daily challenge cannot be modified (`DAILY_CHALLENGE_LOCKED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                locked:
                  externalValue: ./examples/admin/problem.daily-challenge-locked.409.json
  /api/v1/admin/audit-logs:
    get:
      tags: [admin]
      operationId: listAdminAuditLogs
      summary: List administration audit log entries
      description: |
        Requires role `ADMIN` (BE-ADM-01, BE-ADM-02). Lists immutable `admin_audit_log` entries newest first, with
        optional filters for `actorId`, `action`, `targetType`, `from` and `to`.
      parameters:
        - name: actorId
          in: query
          required: false
          description: Filter by administrator user ID.
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          description: Filter by action code (e.g. `USER_LOCKED`, `TRACK_DISABLED`, `DAILY_SCHEDULED`).
          schema:
            type: string
            maxLength: 60
        - name: targetType
          in: query
          required: false
          description: Filter by target resource type (e.g. `USER`, `TRACK`, `PLAYLIST`, `CHAT_REPORT`, `BANNED_WORD`, `DAILY_CHALLENGE`).
          schema:
            type: string
            maxLength: 40
        - name: from
          in: query
          required: false
          description: Filter entries created at or after this UTC timestamp.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Filter entries created at or before this UTC timestamp.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of admin audit log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditLogPage'
              examples:
                default:
                  externalValue: ./examples/admin/list-admin-audit-logs.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (15 minutes), kept in memory by the client (ADR-005).
    refreshCookie:
      type: apiKey
      in: cookie
      name: meloo_refresh
      description: Rotating refresh token. HttpOnly, Secure, SameSite=Lax, Path=/api/v1/auth, 30 days.
  headers:
    RefreshCookie:
      description: '`meloo_refresh=<token>; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=2592000` (or an expired cookie on logout).'
      schema:
        type: string
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoundNo:
      name: roundNo
      in: path
      required: true
      description: One-based round number within the match.
      schema:
        type: integer
        minimum: 1
        maximum: 15
    OAuthProviderPath:
      name: provider
      in: path
      required: true
      description: Lowercase OAuth2 provider identifier (`google` or `facebook`).
      schema:
        $ref: '#/components/schemas/OAuthProviderSlug'
    TrackId:
      name: trackId
      in: path
      required: true
      description: Catalog track UUID.
      schema:
        type: string
        format: uuid
    PlaylistId:
      name: playlistId
      in: path
      required: true
      description: Catalog playlist UUID.
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: User account UUID.
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      description: Chat report UUID.
      schema:
        type: string
        format: uuid
    WordId:
      name: wordId
      in: path
      required: true
      description: Banned word UUID.
      schema:
        type: string
        format: uuid
    ChallengeDate:
      name: challengeDate
      in: path
      required: true
      description: Daily challenge date (`yyyy-MM-dd` in `Asia/Ho_Chi_Minh`).
      schema:
        type: string
        format: date
  responses:
    ValidationFailed:
      description: Invalid input (`VALIDATION_FAILED`); `errors` lists the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              externalValue: ./examples/common/problem.validation-failed.400.json
    Unauthorized:
      description: Missing, expired or invalid credentials (`UNAUTHORIZED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              externalValue: ./examples/common/problem.unauthorized.401.json
    Forbidden:
      description: The account is locked (`ACCOUNT_LOCKED`, BR-28) or the request origin is refused.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The match or round does not exist or is not the caller's (`MATCH_NOT_FOUND`, `ROUND_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            generalNotFound:
              summary: Resource not found.
              externalValue: ./examples/common/problem.not-found.404.json
            matchNotFound:
              summary: Match not found.
              externalValue: ./examples/game/problem.match-not-found.404.json
            roundNotFound:
              summary: Round not found.
              externalValue: ./examples/game/problem.round-not-found.404.json
    TooManyRequests:
      description: Rate limit hit (`RATE_LIMITED`); retry after the `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ErrorCode:
      type: string
      description: |
        Bảng mã lỗi `code` dùng chung cho toàn bộ hệ thống Meloo (RFC 9457 `code`).
        Bao gồm các mã lỗi mặc định HTTP và mã lỗi nghiệp vụ của các module.
      enum:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - UNSUPPORTED_MEDIA_TYPE
        - NOT_ACCEPTABLE
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
        - REFRESH_RACE
        - ACCOUNT_LOCKED
        - TRACK_NOT_FOUND
        - PLAYLIST_NOT_FOUND
        - SOLO_MATCH_IN_PROGRESS
        - NO_ACTIVE_MATCH
        - MATCH_NOT_IN_PROGRESS
        - MATCH_NOT_FOUND
        - MATCH_NOT_FINISHED
        - QUICK_MATCH_REQUIRES_ACCOUNT
        - NOT_ENOUGH_TRACKS
        - ROUND_NOT_ACTIVE
        - ROUND_NOT_FOUND
        - ROUND_NOT_FINISHED
        - LISTEN_LEVEL_MAX
        - LISTEN_LEVEL_MISMATCH
        - SKIP_NOT_ALLOWED
        - AUDIO_TOKEN_INVALID
        - AUDIO_TOKEN_EXPIRED
        - RANGE_NOT_SATISFIABLE
        - ROOM_NOT_FOUND
        - ROOM_FULL
        - ROOM_KICKED
        - NOT_ROOM_HOST
        - ROOM_NOT_LOBBY
        - ROOM_CANNOT_START
        - OAUTH_STATE_INVALID
        - OAUTH_EMAIL_UNVERIFIED
        - OAUTH_IDENTITY_ALREADY_LINKED
        - GUEST_CANNOT_DELETE_ACCOUNT
        - GUEST_PROFILE_READ_ONLY
        - INVALID_AVATAR
        - DAILY_ALREADY_PLAYED
        - DAILY_CHALLENGE_NOT_AVAILABLE
        - DAILY_CHALLENGE_LOCKED
        - STANDARD_PLAYLIST_PROTECTED
        - USER_NOT_FOUND
        - ADMIN_SELF_ACTION_FORBIDDEN
        - REPORT_NOT_FOUND
        - BANNED_WORD_NOT_FOUND
        - BANNED_WORD_ALREADY_EXISTS
    Problem:
      type: object
      description: RFC 9457 problem details with a stable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          description: Field errors, present when field-level validation details are available (e.g. for `VALIDATION_FAILED`).
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    MatchInProgressProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [matchId]
          properties:
            matchId:
              type: string
              format: uuid
              description: The match to resume with `getActiveSoloMatch`.
    NotEnoughTracksProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [missingTracks]
          properties:
            missingTracks:
              type: integer
              minimum: 1
              description: How many more valid tracks the chosen set needs for this round count (BR-09).
    Page:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    UserKind:
      type: string
      enum: [GUEST, REGISTERED]
    UserRole:
      type: string
      enum: [USER, ADMIN]
    PresetAvatarId:
      type: string
      enum:
        - guitar
        - drum
        - headphones
        - disc
        - mic
        - piano
        - radio
        - wave
      description: |
        Preset avatar identifier chosen from the standard musical collection (CT-04, FE-AUTH-04):
        - `guitar`: Classic guitar
        - `drum`: Acoustic drum kit
        - `headphones`: Studio headphones
        - `disc`: Vinyl record disc
        - `mic`: Vocal microphone
        - `piano`: Piano keys
        - `radio`: Vintage radio
        - `wave`: Audio soundwave
    GuestRequest:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 3
          maxLength: 20
          description: Display name (BR-22); a banned word is rejected with 400.
        avatarId:
          $ref: '#/components/schemas/PresetAvatarId'
    Me:
      type: object
      required: [id, kind, role, nickname, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/UserKind'
        role:
          $ref: '#/components/schemas/UserRole'
        nickname:
          type: string
          minLength: 3
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 254
          description: Only for registered users.
        avatarUrl:
          type: [string, 'null']
          description: Optional profile picture URL from linked OAuth provider.
        avatarId:
          type: [string, 'null']
          enum: [guitar, drum, headphones, disc, mic, piano, radio, wave, null]
          description: |
            Identifier of the chosen preset avatar (`guitar`, `drum`, `headphones`, `disc`, `mic`, `piano`, `radio`, `wave`).
            Null when the user has not chosen a preset avatar or uses an OAuth picture.
        profileCompleted:
          type: boolean
          description: |
            Server-managed onboarding flag (CT-04, BE-ID-04, FE-AUTH-04).
            `false` for new OAuth-registered accounts that must complete initial nickname and preset avatar setup.
            `true` once setup is completed, for upgraded guests with valid existing profile, for legacy accounts, and for guest sessions.
            Never inferred from `Player_` prefix.
        rankPoints:
          type: integer
          minimum: 0
          description: Current competitive rank points (`ranked_score` / `rankPoints`, BR-24). Starts at 0 with a floor of 0.
        linkedProviders:
          type: array
          description: Linked OAuth2 providers for registered users (`GOOGLE`, `FACEBOOK`).
          items:
            $ref: '#/components/schemas/OAuthProvider'
        createdAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/Me'
    MusicProvider:
      type: string
      enum: [DEEZER, ITUNES]
      description: Music source (ADR-003).
    TrackSuggestion:
      type: object
      description: A catalog entry shown in the guess box. Catalog-wide; not tied to any round.
      required: [id, title, artistName]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        artistName:
          type: string
          maxLength: 200
    TrackPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TrackSuggestion'
    PlaylistKind:
      type: string
      enum: [STANDARD, CURATED]
      description: '`STANDARD` is the standard curated song set (BR-23).'
    Playlist:
      type: object
      required: [id, code, nameVi, nameEn, kind, trackCount]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 60
        nameVi:
          type: string
          maxLength: 120
        nameEn:
          type: string
          maxLength: 120
        kind:
          $ref: '#/components/schemas/PlaylistKind'
        trackCount:
          type: integer
          minimum: 0
          description: Enabled tracks in the playlist.
    PlaylistPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Playlist'
    Genre:
      type: object
      required: [code, nameVi, nameEn]
      properties:
        code:
          type: string
          maxLength: 40
          examples: [vpop]
        nameVi:
          type: string
          maxLength: 80
        nameEn:
          type: string
          maxLength: 80
    Artist:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
    FilterOptions:
      type: object
      required: [genres, countries, decades, artists]
      properties:
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        countries:
          type: array
          description: ISO 3166-1 alpha-2 codes; the client localizes the names.
          items:
            type: string
            pattern: '^[A-Z]{2}$'
        decades:
          type: array
          description: Decade start years, e.g. 1990.
          items:
            type: integer
        artists:
          type: array
          items:
            $ref: '#/components/schemas/Artist'
    SoloFilter:
      type: object
      additionalProperties: false
      description: Values inside one list are OR-ed; the lists are AND-ed. An empty or missing list does not filter.
      properties:
        genreCodes:
          type: array
          maxItems: 20
          items:
            type: string
        countryCodes:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: '^[A-Z]{2}$'
        decades:
          type: array
          maxItems: 20
          items:
            type: integer
        artistIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
    SoloMode:
      type: string
      enum: [PRACTICE]
      description: 'Solo play mode. Only `PRACTICE` is available; solo matches do not affect rank (BR-23).'
    CreateSoloMatchRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/SoloMode'
          default: PRACTICE
        roundCount:
          type: integer
          enum: [5, 10, 15]
          description: Rounds in the match (BR-09). Defaults to 10 when omitted.
        filter:
          $ref: '#/components/schemas/SoloFilter'
          description: |
            Catalog filter for practice match. Mutually exclusive with `playlistId`: sending both returns 400 (`VALIDATION_FAILED`). Omitted or empty means the whole catalog.
        playlistId:
          type: string
          format: uuid
          description: |
            Specific playlist to practice with, including standard set (`STANDARD`) (BR-23). Mutually exclusive with `filter`: sending both returns 400 (`VALIDATION_FAILED`).
    AudioClip:
      type: object
      description: One listening level as an opaque URL (ADR-008). Never parse it.
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri-reference
          description: Relative to the API origin. Carries no track id or title. Serves exactly `listenSeconds` of audio.
        expiresAt:
          type: string
          format: date-time
          description: Short-lived (2 minutes at most). Ask `getCurrentRound` for a fresh URL after it.
    RoundState:
      type: object
      description: A round in progress. Deliberately has no answer, track id, artist or score field (NFR-07).
      required: [matchId, roundNo, roundCount, level, listenSeconds, canListenMore, canSkip, audio, serverTime]
      properties:
        matchId:
          type: string
          format: uuid
        roundNo:
          type: integer
          minimum: 1
          maximum: 15
        roundCount:
          type: integer
          enum: [5, 10, 15]
        level:
          type: integer
          minimum: 1
          maximum: 5
          description: Opened listening level, 1 to 5 (BR-01).
        listenSeconds:
          type: integer
          enum: [2, 5, 10, 20, 30]
          description: Length of the opened level. The UI label is `2s`, `5s`, ... (glossary).
        canListenMore:
          type: boolean
          description: '`level` < 5.'
        canSkip:
          type: boolean
          description: '`level` = 5 (BR-04).'
        audio:
          $ref: '#/components/schemas/AudioClip'
        serverTime:
          type: string
          format: date-time
          description: Server clock when the response was built; use it to judge `audio.expiresAt` despite clock skew.
    GuessRequest:
      type: object
      additionalProperties: false
      description: The client never sends a score, a level or a time.
      required: [trackId]
      properties:
        trackId:
          type: string
          format: uuid
          description: A suggestion picked from `searchTracks`.
    RoundOutcome:
      type: string
      enum: [CORRECT, WRONG_OUT, GAVE_UP, TIMEOUT, MISSED]
      description: |
        Single play returns `CORRECT`, `WRONG_OUT` (wrong at 30 seconds) and `GAVE_UP` (skip).
        `TIMEOUT` and `MISSED` are used by timed modes (BR-07, BR-14).
    Answer:
      type: object
      description: Revealed only after the round is over.
      required: [trackId, title, artistName, provider, listenUrl]
      properties:
        trackId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        artistName:
          type: string
          maxLength: 200
        provider:
          $ref: '#/components/schemas/MusicProvider'
        listenUrl:
          type: string
          format: uri
          description: Full-listen link on the source platform (BR-29).
        coverUrl:
          type: string
          pattern: '^(|https?://.+)$'
          description: |
            Optional cover art URL of the track (e.g. from Deezer album artwork) for the reveal screen. May be empty ("") or omitted if no artwork is available. Frontend treats an empty string the same as an omitted value (no cover art).
    RoundResult:
      type: object
      required: [roundNo, outcome, baseScore, comboPercent, speedBonus, roundScore, wrongCount, comboStreak, totalScore, answer]
      properties:
        roundNo:
          type: integer
          minimum: 1
          maximum: 15
        outcome:
          $ref: '#/components/schemas/RoundOutcome'
        correctLevel:
          type: integer
          minimum: 1
          maximum: 5
          description: Level of the correct guess; absent unless `outcome` is `CORRECT`.
        baseScore:
          type: integer
          enum: [0, 200, 400, 600, 800, 1000]
          description: BR-02.
        comboPercent:
          type: integer
          enum: [0, 10, 20]
          description: Combo bonus applied to `baseScore` (BR-08).
        speedBonus:
          type: integer
          minimum: 0
          description: BR-07. Always 0 in single play.
        roundScore:
          type: integer
          minimum: 0
          description: '`baseScore` x (1 + `comboPercent` / 100) + `speedBonus`; 0 unless `outcome` is `CORRECT`.'
        wrongCount:
          type: integer
          minimum: 0
        comboStreak:
          type: integer
          minimum: 0
          description: Current streak after this round - consecutive correct rounds at 2s or 5s (BR-08).
        totalScore:
          type: integer
          minimum: 0
          description: Match score after this round.
        answer:
          $ref: '#/components/schemas/Answer'
    RoundEnd:
      type: object
      required: [result, matchFinished]
      properties:
        result:
          $ref: '#/components/schemas/RoundResult'
        matchFinished:
          type: boolean
          description: True after the last round; then call `getMatchResult`.
        nextRound:
          $ref: '#/components/schemas/RoundState'
          description: The next round, already open. Absent when `matchFinished` is true.
    GuessResponse:
      type: object
      required: [correct, rightArtist, roundEnded]
      properties:
        correct:
          type: boolean
        rightArtist:
          type: boolean
          description: True only for a wrong guess by the right main artist (BR-06); always false when `correct` is true.
        roundEnded:
          type: boolean
        round:
          $ref: '#/components/schemas/RoundState'
          description: 'Present while the round continues (`roundEnded` false): the next level is open.'
        end:
          $ref: '#/components/schemas/RoundEnd'
          description: Present when `roundEnded` is true.
    SoloMatch:
      type: object
      description: A match in progress.
      required: [matchId, mode, ranked, roundCount, totalScore, comboStreak, startedAt, expiresAt, currentRound]
      properties:
        matchId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/SoloMode'
        ranked:
          type: boolean
          deprecated: true
          description: Deprecated. Always false; solo matches are never ranked (BR-23). Preserved for backwards compatibility.
        roundCount:
          type: integer
          enum: [5, 10, 15]
        filter:
          $ref: '#/components/schemas/SoloFilter'
        playlistId:
          type: string
          format: uuid
          description: |
            Playlist chosen when creating the match (BR-23). Mutually exclusive with `filter`.
        totalScore:
          type: integer
          minimum: 0
        comboStreak:
          type: integer
          minimum: 0
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: The match becomes `ABANDONED` if nothing happens before this time (30 minutes, BR-23).
        currentRound:
          $ref: '#/components/schemas/RoundState'
    MatchStatus:
      type: string
      enum: [FINISHED, ABANDONED]
    MatchResult:
      type: object
      required: [matchId, mode, ranked, status, roundCount, totalScore, correctCount, rounds, startedAt, endedAt]
      properties:
        matchId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/SoloMode'
        ranked:
          type: boolean
          deprecated: true
          description: Deprecated. Always false; solo matches are never ranked (BR-23). Preserved for backwards compatibility.
        status:
          $ref: '#/components/schemas/MatchStatus'
        roundCount:
          type: integer
          enum: [5, 10, 15]
        totalScore:
          type: integer
          minimum: 0
        correctCount:
          type: integer
          minimum: 0
        rounds:
          type: array
          description: Finished rounds in order; an abandoned match lists only those it finished.
          items:
            $ref: '#/components/schemas/RoundResult'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
    RoomType:
      type: string
      enum: [PRIVATE_ROOM, PUBLIC_ROOM, QUICK_MATCH]
    RoomStatus:
      type: string
      enum: [LOBBY, PLAYING, FINISHED, CLOSED]
    RoomPlayerSummary:
      type: object
      required: [userId, nickname, isHost, isReady, isGuest, isConnected, score]
      properties:
        userId:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 3
          maxLength: 20
        avatarUrl:
          type: [string, 'null']
        avatarId:
          type: [string, 'null']
          enum: [guitar, drum, headphones, disc, mic, piano, radio, wave, null]
          description: |
            Preset avatar identifier if chosen (CT-04, FE-AUTH-04).
            Ghi chú: Cung cấp qua REST API phòng; hợp đồng realtime WebSocket (`asyncapi.yaml`) và payload realtime sẽ được đồng bộ ở ticket contract realtime tiếp theo trước khi FE-ROOM triển khai hiển thị avatar realtime.
        isHost:
          type: boolean
        isReady:
          type: boolean
        isGuest:
          type: boolean
        isConnected:
          type: boolean
          description: Whether player is currently connected via WebSocket (BR-13, BR-14).
        score:
          type: integer
          minimum: 0
    RoomResponse:
      type: object
      required: [roomId, roomType, status, roundCount, maxPlayers, currentRound, playerCount, players, createdAt]
      properties:
        roomId:
          type: string
          format: uuid
        code:
          type: [string, 'null']
          description: 6-character room code; null for quick match rooms (BR-13).
        roomType:
          $ref: '#/components/schemas/RoomType'
        hostId:
          type: [string, 'null']
          format: uuid
          description: Current host user ID; null for quick match rooms (BR-13).
        status:
          $ref: '#/components/schemas/RoomStatus'
        roundCount:
          type: integer
          enum: [5, 10, 15]
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 5
        currentRound:
          type: integer
          minimum: 0
          maximum: 15
        playerCount:
          type: integer
          minimum: 0
          maximum: 5
        players:
          type: array
          items:
            $ref: '#/components/schemas/RoomPlayerSummary'
        playlistId:
          type: [string, 'null']
          format: uuid
        filter:
          $ref: '#/components/schemas/SoloFilter'
        createdAt:
          type: string
          format: date-time
    CreateRoomRequest:
      type: object
      required: [roomType]
      properties:
        roomType:
          type: string
          enum: [PRIVATE_ROOM, PUBLIC_ROOM]
        playlistId:
          type: [string, 'null']
          format: uuid
          description: |
            Predefined playlist ID. Mutually exclusive with `filter`: sending both returns 400 (`VALIDATION_FAILED`). Omitted or empty along with `filter` means the whole catalog.
        filter:
          $ref: '#/components/schemas/SoloFilter'
          description: |
            Catalog filter criteria. Mutually exclusive with `playlistId`: sending both returns 400 (`VALIDATION_FAILED`). Omitted or empty along with `playlistId` means the whole catalog.
        roundCount:
          type: integer
          enum: [5, 10, 15]
          default: 10
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 5
          default: 5
    JoinRoomRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[A-HJ-KM-NP-Z2-9]{6}$'
          description: 6 uppercase alphanumeric characters excluding 0, O, 1, I, L (BR-11).
    QuickMatchRequest:
      type: object
      additionalProperties: false
      description: Matchmaking preferences. Matches existing quick room with compatible filter (BR-13).
      properties:
        playlistId:
          type: [string, 'null']
          format: uuid
          description: |
            Predefined playlist ID. Mutually exclusive with `filter`: sending both returns 400 (`VALIDATION_FAILED`).
        filter:
          $ref: '#/components/schemas/SoloFilter'
          description: |
            Catalog filter criteria. Mutually exclusive with `playlistId`: sending both returns 400 (`VALIDATION_FAILED`).
        genreCodes:
          type: array
          deprecated: true
          description: Deprecated. Use filter.genreCodes instead.
          maxItems: 20
          items:
            type: string
        decades:
          type: array
          deprecated: true
          description: Deprecated. Use filter.decades instead.
          maxItems: 20
          items:
            type: integer
    PublicRoomItem:
      type: object
      required: [roomId, code, hostNickname, playerCount, maxPlayers, roundCount, status, createdAt]
      properties:
        roomId:
          type: string
          format: uuid
        code:
          type: string
        hostNickname:
          type: string
        playerCount:
          type: integer
          minimum: 0
          maximum: 5
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 5
        roundCount:
          type: integer
          enum: [5, 10, 15]
        status:
          $ref: '#/components/schemas/RoomStatus'
        playlistName:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    PublicRoomPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PublicRoomItem'
    OAuthProviderSlug:
      type: string
      enum: [google, facebook]
      description: Lowercase OAuth2 provider slug used in URL paths.
    OAuthProvider:
      type: string
      enum: [GOOGLE, FACEBOOK]
      description: OAuth2/OIDC identity provider stored in `auth_identity` (ADR-005).
    OAuthLinkRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 2048
          description: Unconsumed authorization code issued by the OAuth2 provider after `GET /api/v1/auth/oauth2/{provider}?mode=link`.
        state:
          type: string
          minLength: 1
          maxLength: 512
          description: Anti-CSRF `state` parameter returned by the OAuth2 provider; verified against the caller's HttpOnly state/PKCE cookie and bound `userId`.
        redirectUri:
          type: string
          format: uri
          maxLength: 500
          description: Optional OAuth2 callback redirect URI used when requesting the authorization code (`https://meloo.game/api/v1/auth/oauth2/{provider}/callback`).
    FacebookDataDeletionRequest:
      type: object
      required: [signed_request]
      properties:
        signed_request:
          type: string
          minLength: 1
          maxLength: 4096
          description: Base64url-encoded HMAC-SHA256 signature and payload sent by Meta (`signed_request`).
    FacebookDataDeletionResponse:
      type: object
      required: [url, confirmation_code]
      properties:
        url:
          type: string
          format: uri
          description: Public URL where the user can check the status of their data deletion request.
        confirmation_code:
          type: string
          maxLength: 120
          description: Unique confirmation code for the data deletion request.
    UserProfile:
      type: object
      required: [id, kind, role, nickname, rankPoints, xp, linkedProviders, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/UserKind'
        role:
          $ref: '#/components/schemas/UserRole'
        nickname:
          type: string
          minLength: 3
          maxLength: 20
        email:
          type: [string, 'null']
          format: email
          maxLength: 254
          description: Present for registered users (`REGISTERED`), null for guests.
        avatarUrl:
          type: [string, 'null']
          description: Avatar URL from linked OAuth provider, if available.
        avatarId:
          type: [string, 'null']
          enum: [guitar, drum, headphones, disc, mic, piano, radio, wave, null]
          description: |
            Identifier of the chosen preset avatar (`guitar`, `drum`, `headphones`, `disc`, `mic`, `piano`, `radio`, `wave`).
            Null when the user has not chosen a preset avatar or uses an OAuth picture.
        profileCompleted:
          type: boolean
          description: |
            Server-managed onboarding flag (CT-04, BE-ID-04).
            `false` for new OAuth-registered accounts that must complete initial nickname and preset avatar setup.
            `true` once setup is completed, for upgraded guests with valid existing profile, for legacy accounts, and for guest sessions.
            Never inferred from `Player_` prefix.
        rankPoints:
          type: integer
          minimum: 0
          description: Competitive rank points (`ranked_score` / `rankPoints`, BR-24, 01/11 supplement). Starts at 0 with a floor of 0.
        xp:
          type: integer
          minimum: 0
          description: Cumulative experience points earned across matches.
        linkedProviders:
          type: array
          description: OAuth2 providers linked to this account (`GOOGLE`, `FACEBOOK`).
          items:
            $ref: '#/components/schemas/OAuthProvider'
        createdAt:
          type: string
          format: date-time
    UpdateProfileRequest:
