      summary: Enable or disable a catalog track
      description: |
        Requires role `ADMIN` (`CatalogAdminApi.setTrackEnabled`, BR-27). Enables or disables a track from being
        selected in new rounds or autocomplete, and records an admin audit log entry.
      parameters:
        - $ref: '#/components/parameters/TrackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTrackStatusRequest'
            examples:
              default:
                externalValue: ./examples/admin/set-admin-track-status.request.json
      responses:
        '200':
          description: Track status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTrack'
              examples:
                default:
                  externalValue: ./examples/admin/set-admin-track-status.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Track not found (`TRACK_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                trackNotFound:
                  externalValue: ./examples/game/problem.track-not-found.404.json
  /api/v1/admin/tracks/import:
    post:
      tags: [admin]
      operationId: importAdminTracks
      summary: Import tracks from the music provider into the catalog
      description: |
        Requires role `ADMIN` (`CatalogAdminApi.importByQuery` / `CatalogAdminApi.importByProviderTrackId`). Imports
        tracks either by search `query` (up to `limit`) or by a single `providerTrackId`, skipping tracks without a
        valid preview URL (BR-27), optionally assigning `genreId` and `defaultCountryCode`, and records an admin audit
        log entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTrackImportRequest'
            examples:
              default:
                externalValue: ./examples/admin/import-admin-tracks.request.json
      responses:
        '200':
          description: Provider import summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImportResult'
              examples:
                default:
                  externalValue: ./examples/admin/import-admin-tracks.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Referenced genre or provider track not found (`NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  externalValue: ./examples/common/problem.not-found.404.json
  /api/v1/admin/playlists:
    get:
      tags: [admin]
      operationId: listAdminPlaylists
      summary: List all playlists for administration
      description: |
        Requires role `ADMIN` (`CatalogAdminApi.listPlaylists`). Returns all playlists (curated and standard, enabled
        and disabled) with their `trackIds` and `enabledTrackCount`.
      responses:
        '200':
          description: All playlists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlaylistListResponse'
              examples:
                default:
                  externalValue: ./examples/admin/list-admin-playlists.200.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      operationId: createAdminPlaylist
      summary: Create a new curated playlist
      description: |
        Requires role `ADMIN` (`CatalogAdminApi.createPlaylist`). Creates a curated playlist containing at least 5
        enabled tracks (`trackIds`, BR-09) and records an admin audit log entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreatePlaylistRequest'
            examples:
              default:
                externalValue: ./examples/admin/create-admin-playlist.request.json
      responses:
        '201':
          description: Playlist created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlaylist'
              examples:
                default:
                  externalValue: ./examples/admin/create-admin-playlist.201.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Playlist `code` already exists (`CONFLICT`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Playlist has fewer than 5 enabled tracks (`NOT_ENOUGH_TRACKS`, BR-09).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotEnoughTracksProblem'
              examples:
                notEnoughTracks:
                  externalValue: ./examples/room/problem.not-enough-tracks.422.json
  /api/v1/admin/playlists/{playlistId}:
    put:
      tags: [admin]
      operationId: updateAdminPlaylist
      summary: Update a playlist's names and enabled status
      description: |
        Requires role `ADMIN` (`CatalogAdminApi.updatePlaylist`). Updates localized names (`nameVi`, `nameEn`) and
        `enabled` flag of a playlist. Enabling a playlist requires at least 5 enabled tracks (BR-09).
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdatePlaylistRequest'
            examples:
              default:
                externalValue: ./examples/admin/update-admin-playlist.request.json
      responses:
        '200':
          description: Playlist updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlaylist'
              examples:
                default:
                  externalValue: ./examples/admin/update-admin-playlist.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Playlist not found (`PLAYLIST_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                playlistNotFound:
                  externalValue: ./examples/game/problem.playlist-not-found.404.json
        '422':
          description: Enabling the playlist requires at least 5 enabled tracks (`NOT_ENOUGH_TRACKS`, BR-09).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotEnoughTracksProblem'
              examples:
                notEnoughTracks:
                  externalValue: ./examples/room/problem.not-enough-tracks.422.json
    delete:
      tags: [admin]
      operationId: deleteAdminPlaylist
      summary: Delete a curated playlist
      description: |
        Requires role `ADMIN` (`CatalogAdminApi.deletePlaylist`). Deletes a curated playlist. The standard playlist
        (`curated: false`, BR-23) is protected and cannot be deleted (returns 409 `STANDARD_PLAYLIST_PROTECTED`).
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '204':
          description: Playlist deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Playlist not found (`PLAYLIST_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                playlistNotFound:
                  externalValue: ./examples/game/problem.playlist-not-found.404.json
        '409':
          description: The standard playlist (`STANDARD`) cannot be deleted (`STANDARD_PLAYLIST_PROTECTED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                standardProtected:
                  externalValue: ./examples/admin/problem.standard-playlist-protected.409.json
  /api/v1/admin/playlists/{playlistId}/tracks:
    post:
      tags: [admin]
      operationId: addAdminPlaylistTracks
