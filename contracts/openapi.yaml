openapi: 3.1.0
info:
  title: Meloo API
  version: 3.0.0
  summary: REST contract v3 - authentication, OAuth2, music catalog, solo play, rooms, progression, daily challenge and administration.
  description: |
    Source of truth for the REST API (ADR-002). Backend generates Spring interfaces and models from
    this file; frontend generates `schema.gen.ts`. Only `CT-xx` tickets edit it.

    **Conventions**
    - Every path starts with `/api/v1`.
    - Fields are camelCase, ids are UUID strings, timestamps are ISO-8601 UTC (`date-time`), enums are UPPER_SNAKE.
    - Errors are `application/problem+json` (`Problem`). `code` is the stable machine-readable reason; `detail` is for logs, not for display.
    - Lists are paged with `page` (0-based) and `size`; the response is `Page` plus `items`.
    - Calls need `Authorization: Bearer <accessToken>` unless the operation says `security: []`. Guests have a session too (ADR-005).

    **Fairness (NFR-07).** The server decides answers, scores and clocks. Nothing in an in-progress round
    (`RoundState`, `GuessResponse.round`, `DailyRoundState`, `DailyTodayResponse.round`) names the track, the artist or a track id, and no request carries a score.
    The answer appears only in `RoundResult.answer` or `DailyResult.answer`, after the round is over. Audio is delivered through an opaque,
    short-lived URL (`AudioClip.url`) that never contains an id or a title (ADR-008).
servers:
  - url: /
    description: Same origin as the web app (Vercel rewrites `/api` to the backend; Vite proxies it in development).
tags:
  - name: identity
    description: Guest sessions, OAuth2 login and linking, token refresh, the current user and account deletion.
  - name: catalog
    description: Track search, playlists and filter values.
  - name: game
    description: Single-player matches (practice).
  - name: audio
    description: Stream audio preview clips using opaque HMAC tokens (ADR-008).
  - name: room
    description: Room creation, joining, public rooms and quick match.
  - name: progression
    description: Player profile, match history, statistics, achievements and all-time rank leaderboard.
  - name: daily
    description: Daily challenge gameplay, daily result, streak history and daily leaderboard.
  - name: admin
    description: Administration endpoints for dashboard KPIs, catalog, playlists, users, chat moderation, banned words, daily schedule and audit logs.
security:
  - bearerAuth: []
paths:
  /api/v1/auth/guest:
    post:
      tags: [identity]
      operationId: createGuest
      summary: Start a guest session
      description: |
        Public. Creates a guest user from a nickname (BR-20, BR-22) and returns an access token. The refresh token
        is set as an HttpOnly cookie (ADR-005).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRequest'
            examples:
              default:
                externalValue: ./examples/identity/create-guest.request.json
      responses:
        '201':
          description: Guest session created.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                default:
                  externalValue: ./examples/identity/create-guest.201.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/refresh:
    post:
      tags: [identity]
      operationId: refreshSession
      summary: Rotate the refresh token and get a new access token
      description: |
        Public (no bearer token). Reads the refresh cookie, issues a new one and revokes the old one. Reusing an
        old cookie revokes the whole token family (ADR-005). If two refresh requests race within the rotation
        grace window (10 seconds), the loser receives 401 `REFRESH_RACE` without revoking the token family; the
        client must not treat this as an expired session, but instead reuse the current cookie set by the winning
        request and retry once. The `Origin` header is checked (CSRF). Called on page load because the access token
        lives in memory only.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New session.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                default:
                  externalValue: ./examples/identity/refresh-session.200.json
        '401':
          description: Missing, expired or invalid credentials (`UNAUTHORIZED`), or concurrent refresh race (`REFRESH_RACE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unauthorized:
                  externalValue: ./examples/common/problem.unauthorized.401.json
                refreshRace:
                  externalValue: ./examples/identity/refresh-race.401.json
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/logout:
    post:
      tags: [identity]
      operationId: logout
      summary: End the session
      description: Public. Revokes the refresh token in the cookie and clears it. Idempotent.
      security: []
      responses:
        '204':
          description: Logged out. The refresh cookie is cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
        '400':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/auth/oauth2/{provider}:
    get:
      tags: [identity]
      operationId: startOAuthLogin
      summary: Start OAuth2/OIDC login, guest upgrade, or provider linking
      description: |
        Public, guest, or registered session (ADR-005, BR-20, BR-21). Generates a cryptographic `state` and PKCE
        `code_verifier`, stores them in a short-lived HttpOnly cookie (`Path=/api/v1/auth`), and redirects (302) the
        browser to the provider's authorization endpoint (`google` or `facebook`).
        - **Anonymous login (`mode=login`, no `meloo_refresh` cookie):** starts a new OAuth2 login flow.
        - **Guest upgrade (`mode=login`, guest `meloo_refresh` cookie present):** binds the guest `userId` into the
          signed OAuth `state` cookie so completing authentication upgrades/merges the guest's match history, solo
          records and daily challenge history into the registered account (`GuestMerged`, BR-21).
        - **Link additional provider (`mode=link`, registered `meloo_refresh` cookie present):** binds the caller's
          registered `userId` and `mode=link` into the signed OAuth `state` cookie. When the provider redirects back to
          `GET /api/v1/auth/oauth2/{provider}/callback`, `mode=link` does not consume `code` on the redirect hop; instead
          it redirects (302) to the SPA `/auth/callback?mode=link&provider={provider}&code=...&state=...` so the
          authenticated SPA can call `POST /api/v1/auth/oauth2/{provider}/link` with `Authorization: Bearer <accessToken>`
          plus the HttpOnly state/PKCE cookie to exchange the unused `code` and bind the new `auth_identity`.
      security:
        - {}
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/OAuthProviderPath'
        - name: mode
          in: query
          required: false
          description: Flow mode (`login` for sign-in / guest upgrade via server callback; `link` to forward unused `code` and `state` to the SPA for `POST /api/v1/auth/oauth2/{provider}/link`).
          schema:
            type: string
            enum: [login, link]
            default: login
        - name: returnTo
          in: query
          required: false
          description: Optional relative frontend path to redirect to after `/auth/callback` finishes.
          schema:
            type: string
            maxLength: 200
      responses:
        '302':
          description: Redirects to the OAuth2 provider authorization URL.
          headers:
            Location:
              description: OAuth2 authorization endpoint URL with `client_id`, `redirect_uri`, `response_type=code`, `scope`, `state` and PKCE `code_challenge`.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Short-lived HttpOnly state/PKCE cookie (`SameSite=Lax`, `Path=/api/v1/auth`).
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/oauth2/{provider}/callback:
    get:
      tags: [identity]
      operationId: handleOAuthCallback
      summary: Handle OAuth2 authorization code callback
      description: |
        Public (browser redirect from Google or Facebook, ADR-005).
        - For `mode=login` (default): verifies the `state` and PKCE cookie, exchanges `code` for tokens/profile,
          requires a verified email (`email_verified = true`) to auto-link accounts with the same email across Google
          and Facebook, merges guest data (`GuestMerged`, BR-21) when initiated from a guest session, sets the
          `meloo_refresh` HttpOnly cookie, and redirects (302) to the frontend `/auth/callback` route (which calls
          `POST /api/v1/auth/refresh` to obtain the in-memory access token).
        - For `mode=link` (initiated by a signed-in user via `GET /api/v1/auth/oauth2/{provider}?mode=link`): validates
          that `state` matches the HttpOnly state/PKCE cookie without consuming `code`, and redirects (302) to
          `/auth/callback?mode=link&provider={provider}&code=<code>&state=<state>` so the SPA can complete linking via
          `POST /api/v1/auth/oauth2/{provider}/link`.
        - On provider error, unverified email or locked account (`ACCOUNT_LOCKED`, BR-28), redirects (302) to
          `/auth/callback?error=<code>`.
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProviderPath'
        - name: code
          in: query
          required: false
          description: Authorization code issued by the OAuth2 provider.
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          required: false
          description: Anti-CSRF state parameter echoed back by the OAuth2 provider.
          schema:
            type: string
            maxLength: 512
        - name: error
          in: query
          required: false
          description: OAuth2 error code when the user denies consent or the provider rejects the request.
          schema:
            type: string
            maxLength: 120
        - name: error_description
          in: query
          required: false
          description: Human-readable error description from the OAuth2 provider.
          schema:
            type: string
            maxLength: 500
      responses:
        '302':
          description: 'Redirects to the SPA `/auth/callback` (with `Set-Cookie: meloo_refresh` on login success, `?mode=link&code=...&state=...` for provider linking, or `?error=...` on failure).'
          headers:
            Location:
              description: Frontend callback URI (`/auth/callback`, `/auth/callback?mode=link&...`, or `/auth/callback?error=...`).
              schema:
                type: string
                format: uri-reference
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/oauth2/{provider}/link:
    post:
      tags: [identity]
      operationId: linkOAuthProvider
      summary: Link an OAuth2 provider or exchange an authorization code for the current user
      description: |
        Signed-in user (registered user linking an additional provider, or guest upgrading to a registered account,
        BR-20, BR-21, ADR-005). Completes a flow initiated via `GET /api/v1/auth/oauth2/{provider}?mode=link`:
        verifies that the submitted `state` matches the caller's short-lived HttpOnly state/PKCE cookie (and that the
        `userId` bound in the state cookie matches the caller's Bearer JWT), exchanges the unused OAuth2 authorization
        `code` using the stored PKCE `code_verifier`, links the `auth_identity` (`GOOGLE` or `FACEBOOK`) to the caller's
        user (or merges the guest into the existing registered user when the verified email matches, emitting
        `GuestMerged`), rotates the `meloo_refresh` cookie and returns the updated `AuthSession`.
      parameters:
        - $ref: '#/components/parameters/OAuthProviderPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLinkRequest'
            examples:
              default:
                externalValue: ./examples/identity/link-oauth.request.json
      responses:
        '200':
          description: Provider linked (or guest merged) and new session issued.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                default:
                  externalValue: ./examples/identity/link-oauth.200.json
        '400':
          description: Invalid OAuth code/state (`VALIDATION_FAILED`, `OAUTH_STATE_INVALID`) or unverified provider email (`OAUTH_EMAIL_UNVERIFIED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  summary: Invalid request fields
                  externalValue: ./examples/common/problem.validation-failed.400.json
                unverifiedEmail:
                  summary: OAuth provider did not verify email
                  externalValue: ./examples/identity/problem.oauth-email-unverified.400.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The OAuth identity is already linked to a different account (`OAUTH_IDENTITY_ALREADY_LINKED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                alreadyLinked:
                  externalValue: ./examples/identity/problem.oauth-already-linked.409.json
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/oauth2/facebook/data-deletion:
    post:
      tags: [identity]
      operationId: handleFacebookDataDeletion
      summary: Facebook Login data deletion callback
      description: |
        Public webhook required by Meta for Facebook Login apps (BE-ID-03). Verifies the HMAC-SHA256 `signed_request`
        using the Facebook app secret, anonymizes/deletes the user linked to that Facebook `user_id` if present, and
        returns a status URL plus `confirmation_code`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacebookDataDeletionRequest'
            examples:
              default:
                externalValue: ./examples/identity/facebook-data-deletion.request.json
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FacebookDataDeletionRequest'
      responses:
        '200':
          description: Data deletion request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookDataDeletionResponse'
              examples:
                default:
                  externalValue: ./examples/identity/facebook-data-deletion.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: Get the current user
      description: |
        Any signed-in user, guest or registered. Returns current session user details including `profileCompleted`
        and `avatarId` (CT-04, BE-ID-04, FE-AUTH-04). If `profileCompleted` is false (newly registered OAuth account),
        the frontend displays the initial nickname and avatar onboarding dialog before routing to the destination.
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                default:
                  summary: Guest user
                  externalValue: ./examples/identity/get-me.200.json
                registered:
                  summary: Registered user with OAuth providers, avatar and completed profile
                  externalValue: ./examples/identity/get-me.registered.200.json
                onboarding:
                  summary: Registered user requiring initial profile setup
                  externalValue: ./examples/identity/get-me.onboarding.200.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [identity]
      operationId: deleteMyAccount
      summary: Delete the current registered user's account
      description: |
        Self-service account deletion for registered users (`REGISTERED`, BR-20, BR-21, BE-ID-03, FE-AUTH-03). Revokes
        all refresh tokens, deletes `auth_identity` links, anonymizes personal data while keeping historical match
        integrity, clears the `meloo_refresh` cookie, and returns 204. Guest sessions cannot call this endpoint and
        receive 403 (`GUEST_CANNOT_DELETE_ACCOUNT`).
      responses:
        '204':
          description: Account deleted and refresh cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account is locked (`ACCOUNT_LOCKED`) or caller is a guest (`GUEST_CANNOT_DELETE_ACCOUNT`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                guestCannotDelete:
                  summary: Guest accounts cannot self-delete
                  externalValue: ./examples/identity/problem.guest-cannot-delete-account.403.json
                accountLocked:
                  summary: Account is locked (BR-28)
                  externalValue: ./examples/audio/problem.forbidden.403.json
  /api/v1/tracks/search:
    get:
      tags: [catalog]
      operationId: searchTracks
      summary: Autocomplete track titles
      description: |
        Any signed-in user. Searches the whole catalog by title, accent-insensitive (BR-05, FR-06), so a suggestion
        says nothing about the current round's answer. Only enabled tracks (BR-27) are returned.
      parameters:
        - name: q
          in: query
          required: true
          description: Text typed in the guess box.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Matching tracks, best match first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackPage'
              examples:
                default:
                  externalValue: ./examples/catalog/search-tracks.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/playlists:
    get:
      tags: [catalog]
      operationId: listPlaylists
      summary: List playlists
      description: Any signed-in user. Enabled playlists only (the standard set and curated sets).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of playlists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistPage'
              examples:
                default:
                  externalValue: ./examples/catalog/list-playlists.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/filters:
    get:
      tags: [catalog]
      operationId: getFilters
      summary: List the values usable in a practice filter
      description: |
        Any signed-in user. Only values that have at least one enabled track are listed. Not paged: genres,
        countries and decades are small sets; artists are sorted by name.
      responses:
        '200':
          description: Filter values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptions'
              examples:
                default:
                  externalValue: ./examples/catalog/get-filters.200.json
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/solo/matches:
    post:
      tags: [game]
      operationId: createSoloMatch
      summary: Start a single-player match
      description: |
        Any signed-in user, guests included (BR-20). Solo matches are practice-only and do not affect rank (BR-23).
        Allows selecting either a catalog filter (`filter`) or a specific playlist (`playlistId`), including the standard
        set (`STANDARD`). `filter` and `playlistId` are mutually exclusive; sending both returns 400 (`VALIDATION_FAILED`).
        A user has at most one match in progress: a second call returns 409 with the existing `matchId`, so reloading
        cannot swap a hard song for another. A match can be quit with `abandonSoloMatch`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSoloMatchRequest'
            examples:
              practice:
                externalValue: ./examples/game/create-solo-match.request.practice.json
              practicePlaylist:
                externalValue: ./examples/game/create-solo-match.request.practice-playlist.json
      responses:
        '201':
          description: Match created. The first round is already open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoloMatch'
              examples:
                default:
                  externalValue: ./examples/game/create-solo-match.201.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The playlist was not found or is disabled (`PLAYLIST_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                playlistNotFound:
                  summary: Playlist not found or inactive.
                  externalValue: ./examples/game/problem.playlist-not-found.404.json
        '409':
          description: The user already has a match in progress (`SOLO_MATCH_IN_PROGRESS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MatchInProgressProblem'
              examples:
                default:
                  externalValue: ./examples/game/create-solo-match.409.json
        '422':
          description: The playlist or filter has too few valid tracks (`NOT_ENOUGH_TRACKS`, BR-09).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotEnoughTracksProblem'
              examples:
                default:
                  externalValue: ./examples/game/create-solo-match.422.json
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/solo/matches/active:
    get:
      tags: [game]
      operationId: getActiveSoloMatch
      summary: Resume the match in progress
      description: |
        The caller's own match in progress, with its current round and a fresh audio URL for the level already
        opened (BR-23: a match is kept for 30 minutes after the last action, with the same songs).
      responses:
        '200':
          description: The match in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoloMatch'
              examples:
                default:
                  externalValue: ./examples/game/get-active-solo-match.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No match in progress (`NO_ACTIVE_MATCH`), or it expired and became `ABANDONED`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/solo/matches/{matchId}/rounds/current:
    get:
      tags: [game]
      operationId: getCurrentRound
      summary: Get the current round
      description: |
        The caller's own match only. Returns the open round and a new audio URL for the opened level (use it
        when `AudioClip.expiresAt` has passed). Never contains the answer.
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: The open round.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundState'
              examples:
                default:
                  externalValue: ./examples/game/get-current-round.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The match is not in progress (`MATCH_NOT_IN_PROGRESS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/solo/matches/{matchId}/rounds/{roundNo}/listen-more:
    post:
      tags: [game]
      operationId: listenMore
      summary: Open the next listening level
      description: |
        The match owner only. Opens 2 -> 5 -> 10 -> 20 -> 30 seconds (BR-01, BR-04). Allowed only while `RoundState.canListenMore`;
        at 30 seconds the call returns 409 `LISTEN_LEVEL_MAX` and the player may only guess or skip.
        Listening again to the opened level is free and needs no call (BR-03).

        Order of validation: If the round is already at the maximum level (level 5 / 30s), the server always returns 409 `LISTEN_LEVEL_MAX` first (even if `expectedLevel=5` is sent). If the round is not at maximum level but `expectedLevel` does not match the next level (`currentLevel + 1`), the server returns 409 `LISTEN_LEVEL_MISMATCH`. When receiving 409 `LISTEN_LEVEL_MISMATCH`, the client should call `getCurrentRound` to re-synchronize the round state and audio URL.
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/RoundNo'
        - name: expectedLevel
          in: query
          required: false
          schema:
            type: integer
            minimum: 2
            maximum: 5
          description: |
            Optional expected level to unlock (2 to 5). Guards against double-clicks or retries after timeout so the player does not inadvertently unlock two levels and lose 200 points. If provided and does not match the round's next level, returns 409 `LISTEN_LEVEL_MISMATCH`.
      responses:
        '200':
          description: The round with the new level and its audio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundState'
              examples:
                default:
                  externalValue: ./examples/game/listen-more.200.json
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
