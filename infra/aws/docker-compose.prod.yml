name: meloo-prod

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/thaidevv/meloo-backend:latest}
    container_name: meloo-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - MELOO_CORS_ALLOWED_ORIGINS=${MELOO_CORS_ALLOWED_ORIGINS}
      - MELOO_JWT_SECRET=${MELOO_JWT_SECRET}
      # EC2 t3.micro chỉ có 1 GB RAM: JVM dùng tối đa 60% RAM, thoát an toàn khi OOM
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError
    networks:
      - meloo-internal
    expose:
      - "8080"
    healthcheck:
      # Lệnh healthcheck sẽ được kiểm chứng chính xác cùng Dockerfile ở INF-02 (MEL-41)
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: meloo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN:?Vui lòng cấu hình API_DOMAIN trong .env}
      - ACME_EMAIL=${ACME_EMAIL:?Vui lòng cấu hình ACME_EMAIL trong .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - meloo-internal
    depends_on:
      backend:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  meloo-internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
