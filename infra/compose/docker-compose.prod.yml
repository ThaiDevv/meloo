name: meloo-prod

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/thaidevv/meloo-backend:latest}
    container_name: meloo-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - MELOO_CORS_ALLOWED_ORIGINS=${MELOO_CORS_ALLOWED_ORIGINS}
      - MELOO_JWT_SECRET=${MELOO_JWT_SECRET}
      - MELOO_AUDIO_HMAC_SECRET=${MELOO_AUDIO_HMAC_SECRET:?Thiếu MELOO_AUDIO_HMAC_SECRET trong .env}
      # EC2 t3.micro chỉ có 1 GB RAM: JVM dùng tối đa 60% RAM, thoát an toàn khi OOM
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError
      # Bật access log Tomcat ra stdout (MEL-127). Dùng %m thay vì %r để không lộ raw audio token (contracts/openapi.yaml:554)
      - SERVER_TOMCAT_ACCESSLOG_ENABLED=true
      - SERVER_TOMCAT_ACCESSLOG_BUFFERED=false
      - SERVER_TOMCAT_ACCESSLOG_ROTATE=false
      - SERVER_TOMCAT_ACCESSLOG_DIRECTORY=/dev
      - SERVER_TOMCAT_ACCESSLOG_PREFIX=stdout
      - SERVER_TOMCAT_ACCESSLOG_SUFFIX=
      - SERVER_TOMCAT_ACCESSLOG_PATTERN=%{X-Forwarded-For}i %h %t "%m" %s
    networks:
      - meloo-internal
    # Đóng kín cổng backend (MEL-127): chỉ expose trong mạng docker nội bộ meloo-internal,
    # tuyệt đối không dùng 'ports:' ra host để ngăn bypass reverse proxy và giả mạo IP.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: meloo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN:?Vui lòng cấu hình API_DOMAIN trong .env}
      - ACME_EMAIL=${ACME_EMAIL:?Vui lòng cấu hình ACME_EMAIL trong .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - meloo-internal
    depends_on:
      backend:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  meloo-internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
