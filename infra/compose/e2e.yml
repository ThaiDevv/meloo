name: meloo-e2e

services:
  postgres:
    image: postgres:17-alpine
    container_name: meloo-e2e-postgres
    environment:
      POSTGRES_DB: meloo
      POSTGRES_USER: meloo
      POSTGRES_PASSWORD: meloo
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meloo -d meloo"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: meloo-backend:e2e
    container_name: meloo-e2e-backend
    environment:
      - SPRING_PROFILES_ACTIVE=e2e
      - DB_URL=jdbc:postgresql://postgres:5432/meloo
      - DB_USERNAME=meloo
      - DB_PASSWORD=meloo
      - MELOO_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4173
      - MELOO_JWT_SECRET=meloo-local-development-secret-key-at-least-256-bits-length
      - MELOO_AUDIO_HMAC_SECRET=meloo-local-audio-hmac-secret-at-least-256-bits-length
      - MELOO_IDENTITY_RATELIMIT_GUESTCREATEPERHOUR=100
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 25
      start_period: 25s

  e2e-seed:
    image: postgres:17-alpine
    container_name: meloo-e2e-seed
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../../frontend/e2e/fixtures/seed.sql:/seed.sql:ro,z
    entrypoint:
      - "sh"
      - "-c"
      - "PGPASSWORD=meloo psql -h postgres -U meloo -d meloo -f /seed.sql && echo 'E2E Seed applied successfully'"
    restart: "no"
