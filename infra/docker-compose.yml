services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meloo}
      POSTGRES_USER: ${POSTGRES_USER:-meloo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meloo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - meloo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meloo} -d ${POSTGRES_DB:-meloo}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  meloo-postgres-data:
